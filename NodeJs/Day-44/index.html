<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
        body {
            margin: 0;
            padding-bottom: 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #form {
            background: rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 3rem;
            box-sizing: border-box;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        #input {
            border: none;
            padding: 0 1rem;
            flex-grow: 1;
            border-radius: 2rem;
            margin: 0.25rem;
        }

        #input:focus {
            outline: none;
        }

        #form>button {
            background: #333;
            border: none;
            padding: 0 1rem;
            margin: 0.25rem;
            border-radius: 3px;
            outline: none;
            color: #fff;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        #messages>li {
            padding: 0.5rem 1rem;
        }

        #messages>li:nth-child(odd) {
            background: #efefef;
        }
    </style>
</head>

<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" autocomplete="off" /><button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('send message', { room: true, message: input.value });
                input.value = '';
            }
        });

        socket.on('getMessage', async (obj) => {
            const item = document.createElement('div');
            // const div = item.appendChild('div');
            const li = document.createElement('li');
            li.textContent = obj.id;
            const li2 = document.createElement('li');
            li2.textContent = obj.message;
            socket.emit('getIP', (id) => {
                if (obj.id === id) {
                    item.appendChild(li2);
                    item.appendChild(li);
                    item.style = "display: flex; align-items:center; justify-content:right; gap:20px; margin:10px 20px 10px 20px;";
                } else {
                    item.appendChild(li);
                    item.appendChild(li2);
                    item.style = "display: flex; align-items:center; justify-content:left; gap:20px; margin:10px 20px 10px 20px;";
                }
                console.log(item);
                messages.appendChild(item);

                window.scrollTo(0, document.body.scrollHeight);
            });
        });
    </script>
</body>

</html>
